<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка Z-City</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f1216;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        
        /* Контейнер для фоновых изображений */
        #bg-container {
            width: 100%;
            height: 100%;
            position: absolute;
            z-index: 1;
            /* Легкое размытие для красоты, если хочешь - удали эту строчку */
            filter: blur(4px) brightness(0.7); 
            transform: scale(1.05); /* Убираем белые края от размытия */
        }

        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .bg-layer.active {
            opacity: 1;
        }

        /* Темная накладка поверх картинки и контент */
        .content {
            position: absolute;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            background: rgba(0, 0, 0, 0.4);
        }

        /* Красивый крутящийся спиннер загрузки */
        .loader {
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #00e6ff; /* Цвет Z-City */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 230, 255, 0.5);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }
        
        p {
            font-size: 1.5rem;
            color: #b4b4bc;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="bg-container">
        <!-- Фоны будут добавляться сюда через JavaScript -->
    </div>
    <div class="content">
        <div class="loader"></div>
        <h1>ДОБРО ПОЖАЛОВАТЬ</h1>
        <p>Загрузка игровых данных...</p>
    </div>

    <!-- Невидимый плеер с музыкой -->
    <audio id="bg-music" src="Music.mp3" autoplay loop></audio>

    <script>
        var audio = document.getElementById("bg-music");
        audio.volume = 0.15; // Громкость 15%
        
        audio.play().catch(function(error) {
            console.log("Автоплей заблокирован браузером, ждем загрузки движка");
        });

        // Список изображений (включая оригинальный фон)
        const images = [
            'background.jpeg',
            'images/ira1.jpg',
            'images/eta1.jpg',
            'images/ira2.jpg',
            'images/eta2.jpg'
        ];

        const container = document.getElementById('bg-container');
        let currentIndex = 0;

        // Создаем div для каждого изображения
        images.forEach((src, index) => {
            const div = document.createElement('div');
            div.className = 'bg-layer';
            div.style.backgroundImage = `url('${src}')`;
            if (index === 0) {
                div.classList.add('active'); // Первое изображение активно по умолчанию
            }
            container.appendChild(div);
        });

        const layers = document.querySelectorAll('.bg-layer');

        // Функция для смены изображений
        function changeBackground() {
            // Убираем класс active у текущего изображения
            layers[currentIndex].classList.remove('active');

            // Переходим к следующему
            currentIndex = (currentIndex + 1) % layers.length;

            // Добавляем класс active новому
            layers[currentIndex].classList.add('active');
        }

        // Запускаем интервал каждые 5 секунд (5000 мс)
        setInterval(changeBackground, 5000);
    </script>
</body>
</html>
